<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulli Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,900&display=swap" rel="stylesheet">
</head>
<body>
<style>
:root{
  --paper:#FAFAFA; --card:#FFFFFF; --ink:#212121; --chrome:#FEF200; --hazard:#F03E24;
  --signal:#50E661; --sky:#6BB1BD; --muted:#6B6B6B; --rule:#DCDCDC;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --switzer:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --micro:11px; --tracking-micro:.12em; --tracking-display:-.03em;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:light}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
img{display:block;max-width:100%}
button,select,input,textarea{font-family:inherit;color:inherit}
.cond{font-weight:900;text-transform:uppercase;font-stretch:condensed;letter-spacing:var(--tracking-display);line-height:.9}
.sw{font-family:var(--switzer);font-weight:700}
.micro{font-size:var(--micro);letter-spacing:var(--tracking-micro);text-transform:uppercase;font-weight:600}
.mono-num{font-variant-numeric:tabular-nums}
a{color:inherit}

/* ===== APP SHELL ===== */
#app{max-width:1240px;margin:0 auto;padding:20px 24px 80px}
@media (max-width:720px){ #app{padding:14px 14px 60px} }

/* ===== PORTADA =====
   Medidas tomadas del diseño de Canva (3000×358). Las unidades cqw escalan
   todo en proporción al ancho de la portada. */
.cover{margin-bottom:10px}
.cover-art{
  position:relative;container-type:inline-size;aspect-ratio:3000/358;
  background:#7EE78A;color:var(--ink);overflow:hidden;
}
.cover-dog{position:absolute;left:0;bottom:0;width:18.667cqw;height:auto;display:block}
.cover-title{position:absolute;left:17.066cqw;top:3.22cqw;margin:0;font-family:"Archivo",var(--sans);font-stretch:75%;font-size:5.184cqw;font-weight:900;line-height:.8;letter-spacing:-.006em;white-space:nowrap}
.cover-sub{position:absolute;left:17.196cqw;top:7.492cqw;font-size:2cqw;font-weight:400;line-height:1;white-space:nowrap}
.cover-logo{position:absolute;right:3.833cqw;top:4.2cqw;width:12.467cqw}
.cover-logo svg{display:block;width:100%;height:auto}
@media (max-width:640px){
  .cover-art{aspect-ratio:auto;min-height:104px;padding:36px 14px 14px 132px}
  .cover-dog{width:auto;height:92px}
  .cover-title,.cover-sub{position:relative;left:auto;top:auto;display:block;white-space:normal}
  .cover-title{font-size:28px;line-height:.9}
  .cover-sub{font-size:13px;margin-top:5px}
  .cover-logo{right:14px;top:12px;width:70px}
}
.cover-meta{display:flex;justify-content:flex-end;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.sync-chip{display:flex;align-items:center;gap:7px;font-size:var(--micro);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync-dot.-on{background:var(--signal)}
.sync-dot.-local{background:var(--chrome)}

/* ===== TABS ===== */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-bottom:28px;overflow-x:auto}
.tab-btn{
  appearance:none;border:none;background:none;cursor:pointer;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:14px 18px 12px;border-bottom:4px solid transparent;color:var(--muted);white-space:nowrap;
}
.tab-btn:hover{color:var(--ink)}
.tab-btn.-active{color:var(--ink);border-bottom-color:var(--signal)}
.tab-btn:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

/* ===== SECTION HEADINGS ===== */
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.view-head h2{font-size:clamp(26px,4vw,40px)}
.view-head .sub{color:var(--muted);font-size:15px;max-width:56ch;margin-top:6px}

/* ===== KPI GRID ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--ink);border:2px solid var(--ink);margin-bottom:28px}
.kpi{background:var(--card);padding:18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi.-accent{background:var(--signal)}
.kpi.-warn{background:var(--hazard);color:var(--paper)}
.kpi .num{font-family:var(--sans);font-weight:900;font-stretch:condensed;font-size:clamp(28px,3.4vw,44px);line-height:1}
.kpi .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.kpi.-accent .lbl,.kpi.-warn .lbl{color:inherit;opacity:.82}
@media (max-width:920px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}

/* ===== ESTADO GENERAL BANNER ===== */
.status-banner{
  display:flex;align-items:center;gap:14px;border:2px solid var(--ink);padding:16px 20px;margin-bottom:28px;background:var(--card);
}
.status-banner .dot{width:14px;height:14px;flex:none;background:var(--signal)}
.status-banner.-warn .dot{background:var(--chrome)}
.status-banner.-risk .dot{background:var(--hazard)}
.status-banner .txt b{font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.status-banner .txt span{display:block;color:var(--muted);font-size:13px;margin-top:2px}

/* ===== FASE PROGRESS ROW ===== */
.fase-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
@media (max-width:820px){.fase-row{grid-template-columns:repeat(2,1fr)}}
.fase-card{border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.fase-card .flabel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.25;min-height:2.4em}
.fase-card .fsub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.fase-bar{height:10px;background:var(--paper);border:1.5px solid var(--ink);position:relative;overflow:hidden}
.fase-bar i{display:block;height:100%;background:var(--signal)}
.fase-nums{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.fase-nums b{color:var(--ink)}

/* ===== OBJETIVO / PRIORIDADES BLOCK ===== */
.strategy-block{border:2px solid var(--ink);margin-bottom:32px;background:var(--card)}
.strategy-block .obj-head{padding:22px 24px;border-bottom:2px solid var(--ink);background:var(--chrome)}
.strategy-block .obj-head .micro{color:var(--ink);opacity:.7}
.strategy-block .obj-head p{font-size:17px;line-height:1.4;max-width:80ch;margin-top:8px;font-weight:500}
.prio-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media (max-width:820px){.prio-list{grid-template-columns:1fr}}
.prio-item{padding:20px 22px;border-right:2px solid var(--ink)}
.prio-item:last-child{border-right:none}
@media (max-width:820px){.prio-item{border-right:none;border-bottom:2px solid var(--ink)}.prio-item:last-child{border-bottom:none}}
.prio-item .n{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.prio-item h4{font-size:16px;text-transform:uppercase;margin:6px 0 8px;letter-spacing:-.01em}
.prio-item p{font-size:13.5px;line-height:1.5;color:var(--muted)}
.prio-item .prio-avance{margin-top:14px;display:flex;flex-direction:column;gap:7px}

/* ===== FILTER BAR ===== */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;padding:14px;border:2px solid var(--ink);background:var(--card)}
.filter-bar .fgroup{display:flex;flex-direction:column;gap:4px}
.filter-bar label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.filter-bar select{
  border:2px solid var(--ink);background:var(--paper);padding:8px 30px 8px 10px;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.03em;font-weight:600;appearance:none;cursor:pointer;min-width:150px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23212121'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
}
.filter-bar select:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.filter-clear{
  margin-left:auto;background:none;border:2px solid transparent;text-decoration:underline;
  font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;cursor:pointer;padding:8px 4px;color:var(--muted);
}
.filter-clear:hover{color:var(--hazard)}
.result-count{font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}

/* ===== FASE GROUP HEADER (plan view) ===== */
.group-head{
  display:flex;align-items:center;gap:12px;margin:30px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink);
}
.group-head:first-child{margin-top:0}
.group-head h3{font-size:19px;text-transform:uppercase;letter-spacing:-.01em}
.group-head .count{font-size:12px;color:var(--muted);font-weight:700}
.group-head .swatch{width:14px;height:14px;flex:none;background:var(--signal)}
.task-row .col-area{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.tk-prio{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border:1.5px solid var(--ink);color:var(--ink)}
.tk-prio.-sin{border-color:var(--rule);color:var(--muted)}
.group-head .gh-prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--muted)}
.group-head .gh-prog .bar{width:120px;height:8px;background:var(--paper);border:1.5px solid var(--ink);overflow:hidden}
.group-head .gh-prog .bar i{display:block;height:100%;background:var(--signal)}
.group-head .gh-prog b{color:var(--ink)}
@media (max-width:600px){.group-head .gh-prog .bar{display:none}}

/* ===== TASK LIST ===== */
.task-list{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.task-row{
  display:grid;grid-template-columns:.8fr .95fr 1.9fr 96px 112px 150px 1.25fr 34px;gap:14px;align-items:center;
  padding:13px 4px;border-bottom:1.5px solid var(--rule);
}
.task-row:hover{background:rgba(33,33,33,.03)}
.task-row.-editable{cursor:pointer}
.task-row.-overdue{background:rgba(240,62,36,.06)}
@media (max-width:980px){
  .task-row{grid-template-columns:1fr;gap:8px;padding:14px 4px}
  .task-row .col-dates,.task-row .col-resp{justify-self:start}
}
.tk-tema{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:3px}
.tk-tarea{font-size:14.5px;line-height:1.35;font-weight:500}
.tk-flags{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.flag{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1.5px solid var(--hazard);color:var(--hazard)}
.resp-chip{
  width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;background:var(--card);flex:none;
}
.col-resp{display:flex;align-items:center;gap:8px}
.col-resp .rname{font-size:11.5px;color:var(--muted);font-weight:600}
.col-dates{font-size:11.5px;color:var(--muted);line-height:1.5;font-weight:500}
.tk-resp{font-size:13px;font-weight:600}
.tk-obs{font-size:12px;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
.col-dates b{color:var(--ink);font-weight:700}
.urg-dot{width:9px;height:9px;flex:none;background:var(--muted);margin-right:6px;display:inline-block}
.urg-Alta{background:var(--hazard)}
.urg-Media{background:var(--chrome)}
.urg-Baja{background:var(--rule)}
.status-select{
  border:2px solid var(--ink);padding:7px 24px 7px 10px;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;appearance:none;cursor:pointer;width:100%;
  background-repeat:no-repeat;background-position:right 8px center;background-size:9px 6px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23212121'/></svg>");
}
/* Estados: Pendiente rojo · En proceso amarillo · Seguimiento celeste · En testeo violeta · Finalizada verde */
.st-Por-hacer{background:#E5484D;color:#fff;border-color:#B9282D}
.st-En-proceso{background:#F5C518;color:#212121;border-color:#C89E00}
.st-Seguimiento{background:#8FD3F4;color:#212121;border-color:#4BA9D6}
.st-En-testeo{background:#9B6BDF;color:#fff;border-color:#7447B8}
.st-Completado{background:#3DBE6A;color:#fff;border-color:#23914A}
/* Selector de tablero (Administración · Médicos · Comercial) */
.tablero-bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.tablero-btn{
  border:2px solid var(--ink);background:var(--card);padding:9px 16px;cursor:pointer;
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
}
.tablero-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tablero-btn .n{font-weight:600;opacity:.7;margin-left:8px}
.obs-btn{
  width:30px;height:30px;border:2px solid var(--ink);background:var(--card);cursor:pointer;
  display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;
}
.obs-btn:hover{background:var(--ink);color:var(--paper)}
.obs-btn[disabled]{opacity:.25;cursor:default}
.obs-btn[disabled]:hover{background:var(--card);color:var(--ink)}
.empty-note{padding:36px 8px;text-align:center;color:var(--muted);font-size:14px;border-bottom:1.5px solid var(--rule)}

/* ===== TIMELINE ===== */
.tl-month{margin-bottom:8px}
.tl-month-head{
  position:sticky;top:0;background:var(--paper);z-index:1;
  font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;
  padding:10px 0;border-bottom:2px solid var(--ink);margin-bottom:2px;
}
.tl-item{display:flex;gap:16px;padding:12px 0;border-bottom:1.5px solid var(--rule)}
.tl-date{width:66px;flex:none;font-size:12px;font-weight:800;color:var(--muted);padding-top:2px}
.tl-node{width:12px;flex:none;display:flex;justify-content:center;padding-top:5px}
.tl-node i{width:12px;height:12px;background:var(--ink);display:block}
.tl-node i.-done{background:var(--signal)}
.tl-node i.-overdue{background:var(--hazard)}
.tl-body{flex:1;min-width:0}
.tl-body .tt{font-size:14.5px;font-weight:600;line-height:1.35}
.tl-body .tm{font-size:11.5px;color:var(--muted);margin-top:3px}

/* ===== PENDIENTES ===== */
.pend-section{margin-bottom:34px}
.pend-section h3{font-size:18px;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.pend-section h3 .tag-count{background:var(--ink);color:var(--paper);font-size:12px;padding:2px 9px;font-weight:700}
.pend-card{border:2px solid var(--ink);padding:14px 16px;margin-bottom:10px;background:var(--card);display:flex;gap:14px;align-items:flex-start}
.pend-card.-hazard{border-color:var(--hazard)}
.pend-card .body{flex:1;min-width:0}
.pend-card .tt{font-size:14px;font-weight:600;line-height:1.35}
.pend-card .mt{font-size:11.5px;color:var(--muted);margin-top:5px}
.backlog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.backlog-item{border:1.5px dashed var(--ink);padding:12px 14px;font-size:13px;line-height:1.4}
.backlog-item .bl-area{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:4px}
.backlog-item .bl-fase{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;border:1.5px solid var(--rule);padding:1px 6px;color:var(--muted)}

/* ===== ENTREGABLES ===== */
.deliv-grid{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.deliv-row{display:grid;grid-template-columns:26px 1.4fr 1.6fr 130px 120px;gap:14px;align-items:center;padding:13px 4px;border-bottom:1.5px solid var(--rule)}
@media (max-width:900px){.deliv-row{grid-template-columns:1fr}}
.deliv-icon{width:26px;height:26px;background:var(--ink);color:var(--chrome);display:grid;place-items:center;font-size:12px;font-weight:800}
.deliv-name{font-size:14px;font-weight:600;line-height:1.35}
.deliv-task{font-size:12.5px;color:var(--muted);line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--ink);padding:4px 9px;width:fit-content}

/* ===== NOTAS ===== */
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.notes-grid{grid-template-columns:1fr}}
.note-compose{border:2px solid var(--ink);padding:16px;background:var(--card);margin-bottom:18px}
.note-compose textarea{
  width:100%;border:2px solid var(--ink);padding:10px;font-size:14px;font-family:inherit;resize:vertical;min-height:70px;background:var(--paper);
}
.note-compose .row{display:flex;gap:10px;margin-top:10px;align-items:center}
.note-compose select{border:2px solid var(--ink);padding:8px;font-size:12px;text-transform:uppercase;font-weight:700;background:var(--paper)}
.btn-primary{
  background:var(--ink);color:var(--chrome);border:2px solid var(--ink);padding:10px 20px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;cursor:pointer;
}
.btn-primary:hover{background:var(--hazard);border-color:var(--hazard);color:var(--paper)}
.btn-primary:disabled{opacity:.4;cursor:default;background:var(--muted);border-color:var(--muted)}
.note-item{border-left:4px solid var(--ink);padding:10px 0 10px 14px;margin-bottom:14px}
.note-item .who{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.note-item .when{font-weight:500;text-transform:none;letter-spacing:0}
.note-item p{font-size:14px;line-height:1.5;margin-top:4px}

/* ===== MODAL ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(33,33,33,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-backdrop[hidden]{display:none}
.modal-box{background:var(--paper);border:2px solid var(--ink);max-width:480px;width:100%;padding:24px;max-height:80vh;overflow:auto}
.modal-box h3{font-size:20px;text-transform:uppercase;margin-bottom:14px;padding-right:30px}
.modal-box .mrow{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1.5px solid var(--rule);font-size:13.5px}
.modal-box .mrow:first-of-type{border-top:none}
.modal-box .mrow .k{color:var(--muted);font-weight:600;flex:none;width:110px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;line-height:1}
.modal-wrap{position:relative}

/* ===== FORM FIELDS (modal add-task / add-meeting) ===== */
.field{margin-bottom:14px}
.field label.flabel{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input[type="text"],.field input[type="url"],.field input[type="date"],.field input[type="email"],.field input[type="password"],.field select,.field textarea{
  width:100%;border:2px solid var(--ink);padding:9px 10px;font-size:13.5px;background:var(--paper);font-family:inherit;
}
.field textarea{resize:vertical;min-height:64px}
.-missing{border-color:var(--hazard)!important;box-shadow:0 0 0 1px var(--hazard)}
.form-error{color:var(--hazard);font-size:12.5px;font-weight:700;margin-top:10px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.modal-actions button{white-space:nowrap}
.view-head .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
a.btn-link{text-decoration:none;display:inline-flex;align-items:center}
.btn-secondary{
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:10px 20px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;cursor:pointer;
}
.btn-secondary:hover{background:var(--rule)}
.btn-danger{

function prioridadesDefinidas(){

function escHtml(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* Opciones de un <select>; si el valor actual no está en la lista, se agrega. */
function optionsHtml(list, current, emptyLabel){
  const vals = list.slice();
  if(current && !vals.includes(current)) vals.unshift(current);
  return `<option value="">${emptyLabel||"—"}</option>` +
    vals.map(v=>`<option value="${escHtml(v)}" ${v===current?"selected":""}>${escHtml(v)}</option>`).join("");
}
/* Responsable como desplegable (antes era texto con sugerencias y solo mostraba
   nombres parecidos a lo ya escrito). "+ Agregar responsable…" suma un nombre
   nuevo, que se guarda en la tarea al guardar. */
const NUEVO_RESP = "__nuevo__";
function respSelectHtml(current){
  return optionsHtml(allResponsables(), current, "Sin asignar") + `<option value="${NUEVO_RESP}">+ Agregar responsable…</option>`;
}
function wireRespSelect(sel){
  if(!sel) return;
  let previo = sel.value;
  sel.addEventListener("change", ()=>{
    if(sel.value!==NUEVO_RESP){ previo = sel.value; return; }
    const nombre = (prompt("Nombre del nuevo responsable:") || "").trim();
    if(!nombre){ sel.value = previo; return; }
    if(![...sel.options].some(o=>o.value===nombre)){
      const opt = document.createElement("option");
      opt.value = nombre; opt.textContent = nombre;
      sel.insertBefore(opt, sel.querySelector(`option[value="${NUEVO_RESP}"]`));
    }
    if(!RESPONSABLES.includes(nombre)) RESPONSABLES.push(nombre);
    sel.value = nombre;
    previo = nombre;
  });
}
function toHref(s){ const v=s.trim(); return /^https?:\/\//i.test(v) ? v : "https://"+v; }
/* Cada tarea admite hasta 3 links. Se guardan juntos en el campo "link",
   uno por línea, así la hoja y el backend no necesitan columnas nuevas. */
const MAX_LINKS = 3;
/* Carpeta de Drive de trabajo del cliente (botón arriba del Plan de trabajo). */
const DRIVE_URL = "https://drive.google.com/drive/u/0/folders/1H6BEDfgFArCTALqf5z3VHjCW_elwqGVY";
function parseLinks(s){ return String(s||"").split(/\s*\n\s*|\s+\|\s+/).map(x=>x.trim()).filter(Boolean).slice(0, MAX_LINKS); }
function joinLinks(arr){ const v = (arr||[]).map(x=>String(x||"").trim()).filter(Boolean).slice(0, MAX_LINKS); return v.length ? v.join("\n") : null; }
function linkLabel(url){
  try{ const u = new URL(toHref(url)); return u.hostname.replace(/^www\./,""); }catch(e){ return url; }
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"short"}).replace(".","");
}
function fmtDateLong(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});
}
function todayMidnight(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function dueDateOf(t){ return t.cierre || t.tiempo || t.inicio || null; }
function isOverdue(t, estado){
  if(estado==="Completado") return false;
  const due = dueDateOf(t);
  if(!due) return false;
  return new Date(due+"T00:00:00") < todayMidnight();
}
function urgencia(t, estado){
  if(estado==="Completado") return "Baja";
  const due = dueDateOf(t);
  if(!due) return "Baja";
  const days = Math.round((new Date(due+"T00:00:00") - todayMidnight())/86400000);
  if(days < 0) return "Alta";
  if(days <= 10) return "Alta";
  if(days <= 25) return "Media";
  return "Baja";
}

/* =====================================================================
   CONSTRUCCIÓN DEL DATASET UNIFICADO
   ===================================================================== */
/* El id se deriva del contenido (no de la posición) para que los estados,
   fechas y links guardados sigan apuntando a la misma tarea cuando se
   vuelven a importar los datos del Sheet con filas nuevas o reordenadas. */
let idSeen = {};
function hashId(str){
  let h = 5381;
  for(let i=0;i<str.length;i++) h = (((h<<5)+h) ^ str.charCodeAt(i)) >>> 0;
  return "t"+h.toString(36);
}
function mk(base, source){
  const key = source==="etapa1"
    ? ["reunion", base.tarea||"", base.inicio||""].join("|")
    : [tableroActivo, source, base.tema||"", base.tarea||""].join("|");
  idSeen[key] = (idSeen[key]||0) + 1;
  const id = hashId(key + "#" + idSeen[key]);
  const estadoOriginal = base.estado || null;
  return Object.assign({id, source, estadoOriginal}, base);
}
let TASKS = [];
/* Lo que se acaba de editar, guardado unos minutos. La relectura del Sheet a
   veces llega atrasada (Google responde lento o devuelve una copia vieja) y
   sin esto el cambio se ve volver atrás solo. Se indexa por tema+tarea porque
   el id cambia cuando la tarea pasa a Finalizadas. */
const RECIENTES_MS = 3 * 60 * 1000;
const recientes = new Map();
function claveTarea_(t){ return String(t.tema||"") + "|" + String(t.tarea||""); }
function recordarCambio_(t, fields){
  const previo = recientes.get(claveTarea_(t));
  recientes.set(claveTarea_(t), {fields: Object.assign({}, previo && previo.fields, fields), ts: Date.now()});
}
function aplicarRecientes_(){
  const ahora = Date.now();
  recientes.forEach((v, k)=>{ if(ahora - v.ts > RECIENTES_MS) recientes.delete(k); });
  if(!recientes.size) return;
  TASKS.forEach(t=>{
    if(t.source==="etapa1") return;
    const r = recientes.get(claveTarea_(t));
    if(!r) return;
    Object.keys(r.fields).forEach(k=>{
      if(r.fields[k]===undefined) return;
      t[k] = r.fields[k];
      if(k==="estado") t.estadoOriginal = ESTADO_A_SHEET[r.fields[k]] || r.fields[k];
    });
  });
}

function rebuildTasks_(){
  idSeen = {};
  TASKS = [];
  RAW.etapa1.forEach(e=>{
    TASKS.push(mk({tema:"Reuniones", tarea:e.tarea, responsable:e.responsable,
      inicio:e.fecha, tiempo:e.fecha, cierre:e.fecha, estado:e.estado, obs:e.resultado}, "etapa1", 0));
  });
  RAW.iniciativas.forEach(t=> TASKS.push(mk(t, "iniciativa")));
  RAW.finalizados.forEach(t=> TASKS.push(mk(t, "finalizado")));
  RAW.backlog.forEach(str=>{
    const parts = str.split(" I ").map(s=>s.trim());
    const area = parts[0];
    let tema = null, desc = parts.slice(1).join(" I ");
    if(parts.length >= 3){ tema = parts[1]; desc = parts.slice(2).join(" I "); }
    const faseMatch = desc.match(/Fase\s*(\d)/i);
    const subfase = faseMatch ? "Fase "+faseMatch[1] : null;
    const descClean = desc.replace(/Fase\s*\d\s*[·.]?\s*/i,"").trim();
    const tarea = tema ? (tema+" — "+descClean) : descClean;
    TASKS.push(mk({area, tema, tarea, subfase, responsable:null, inicio:null, tiempo:null, cierre:null, estado:null, obs:null}, "backlog"));
  });
  aplicarRecientes_();
}
aplicarTablero_(); // vuelca el tablero activo en RAW y construye TASKS

/* Con el Sheet conectado, las tareas se escriben directo en su fila de "02"
   y las reuniones en la tabla de "01". Se muestra el cambio al instante,
   se guarda (en orden) y al terminar se vuelve a leer el Sheet. */
const ESTADO_A_SHEET = {"Por hacer":"Pendiente","En proceso":"En proceso","Seguimiento":"Seguimiento","En testeo":"En testeo","Completado":"Finalizada"};
function sheetLive(){ return dbMode==="live" && !!gasData; }
/* Con el Sheet configurado, las ediciones siempre van al Sheet: se muestran al
   instante y se guardan en segundo plano, aunque la conexión esté lenta. */
function sheetMode(){ return gasConfigured() && dbMode!=="local"; }

let resolveFirstRead = null;
const firstRead = new Promise(r=>{ resolveFirstRead = r; });

let sheetQueue = Promise.resolve();
let sheetPending = 0;

/* Los cambios por enviar se guardan en el navegador: si se recarga la página
   antes de que Google responda, se envían en la visita siguiente. */
function leerPendientes(){ try{ return JSON.parse(localStorage.getItem(localKey("pendientes"))||"[]"); }catch(e){ return []; } }
function guardarPendientes(list){ try{ localStorage.setItem(localKey("pendientes"), JSON.stringify(list)); }catch(e){} }

function updateSyncLabel(){
  const lbl = document.getElementById("sync-label");
  if(!lbl) return;
  if(sheetPending>0) lbl.textContent = "Guardando " + sheetPending + (sheetPending===1 ? " cambio…" : " cambios…");
  else if(dbMode==="live") lbl.textContent = "Sincronizado con el equipo";
  else if(dbMode==="retrying") lbl.textContent = "Sin conexión con el Sheet, reintentando…";
  else if(dbMode==="checking") lbl.textContent = "Conectando…";
}

async function sheetWrite(action, payload){
  /* La hoja tiene sus propias palabras para el estado. Si se le manda el
     nombre interno ("Por hacer"), su desplegable lo rechaza y el estado
     termina anotado en Observaciones en vez de en su columna. */
  if(payload && payload.fields && payload.fields.estado){
    payload = Object.assign({}, payload, {fields: Object.assign({}, payload.fields,
      {estado: ESTADO_A_SHEET[payload.fields.estado] || payload.fields.estado})});
  }
  const item = {id: "p" + Date.now() + Math.random().toString(36).slice(2,6), action, payload};
  guardarPendientes(leerPendientes().concat([item]));
  sheetPending++;
  updateSyncLabel();
  const job = sheetQueue.then(async ()=>{
    // Primera visita sin datos guardados: se espera la primera lectura para usar los ids reales.
    if(!gasData) await firstRead;
    // Se saca de pendientes justo antes de enviarlo, para no mandarlo dos veces.
    guardarPendientes(leerPendientes().filter(x=>x.id!==item.id));
    let res;
    try{
      res = await gasWrite_(action, payload);
    }catch(e){
      if(esIdViejo_(e) && payload && payload.id){
        res = await reintentarConIdNuevo_(action, payload);
      } else if((e.soft || e.reintentable) && (action === "addTask" || action === "addMeetingSheet")){
        res = await reintentarAlta_(action, payload);
      }
      if(!res) throw e;
    }
    // Un desplegable de la hoja puede rechazar un valor (ej. un Área que no está
    // en su lista). El resto se guarda igual y eso queda anotado en Observaciones.
    if(res && res.enObservaciones && res.enObservaciones.length){
      alert("Guardé la tarea, pero el Sheet no aceptó estos valores porque su desplegable no los tiene:\n\n" +
        res.enObservaciones.join("\n") + "\n\nQuedaron anotados en Observaciones. Para que entren en su columna, agregá esa opción al desplegable de la hoja.");
    }
    return res;
  }).catch(e=>{
    console.error(e);
    // Solo vuelve a la cola lo que puede andar en otro momento. Un error
    // definitivo (la tarea ya no existe) repetido en cada visita sería un
    // cartel eterno que no arregla nada.
    const transitorio = !!(e.soft || e.reintentable);
    if(transitorio && ACCIONES_REPETIBLES.includes(action)){
      guardarPendientes(leerPendientes().concat([item]));
    }
    if(!e.soft){
      alert("No se pudo guardar en el Sheet: " + e.message +
        (transitorio ? "\n\nQueda en cola y se reintenta solo." : ""));
    }
  });
  sheetQueue = job;
  await job;
  // La relectura cuenta como parte del guardado: hasta que termina, las
  // tareas recién creadas siguen con id provisorio ("tmp…").
  if(sheetPending===1){ try{ await gasRefresh_(); }catch(e){ console.error(e); } }
  sheetPending--;
  updateSyncLabel();
}

window.addEventListener("beforeunload", (e)=>{

function sheetTaskEdit(t, fields){
  recordarCambio_(t, fields);
  const local = TASKS.find(x=>x.id===t.id);
  if(local){
    Object.assign(local, fields);
    if(fields.estado) local.estadoOriginal = ESTADO_A_SHEET[fields.estado] || fields.estado;
  }
  const ov = overridesState[t.id];
  if(ov){ delete ov.estado; delete ov.inicio; delete ov.cierre; }
  if(fields.link!==undefined) overridesState[t.id] = Object.assign({}, overridesState[t.id], {link: fields.link});
  render();
  return sheetWrite("updateTask", {tablero: tableroActivo, id: t.id, fields});
}

/* =====================================================================
   APPS SCRIPT ADAPTER
   Implementa la misma interfaz que la db capability de arriba
   (doc/collection/onSnapshot), respaldada por un Web App de Google Apps
   Script que lee y escribe en el Google Sheet.

   - UNA sola lectura al abrir la página: trae en el mismo request las
     tareas base (leídas en vivo de "01"/"02") y lo editable desde la web.
   - Escribe solo cuando el usuario crea, edita o borra algo.
   - Sin polling, sin triggers, sin pestañas espejo.
   ===================================================================== */
const GAS_CFG = window.GULLI_GAS_CONFIG || {};
let gasData = null; // snapshot leído al abrir

function gasConfigured(){
  return !!(GAS_CFG.url && GAS_CFG.token && !/YOUR-/.test(GAS_CFG.url + GAS_CFG.token));
}

async function gasRead_(){
  const sep = GAS_CFG.url.indexOf("?")>=0 ? "&" : "?";
  // Google a veces responde con una página de error pasajera: se reintenta.
  let lastErr = null;
  for(let intento=0; intento<4; intento++){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 15000);
    try{
      const res = await fetch(GAS_CFG.url + sep + "action=read&token=" + encodeURIComponent(GAS_CFG.token), {signal: ctrl.signal});
      const json = await res.json();
      if(!json.ok) throw new Error(json.error || "error leyendo el Sheet");
      return json;
    }catch(e){
      lastErr = e;
      await new Promise(r=>setTimeout(r, 1000*(intento+1)));
    }finally{
      clearTimeout(timer);
    }
  }
  throw lastErr;
}

/* La última lectura buena se guarda en el navegador: al abrir, la web muestra
   esos datos al instante (los mismos del Sheet) mientras conecta. */
function guardarLectura(data){ try{ localStorage.setItem(localKey("ultimaLectura"), JSON.stringify(data)); }catch(e){} }
function leerLectura(){ try{ return JSON.parse(localStorage.getItem(localKey("ultimaLectura"))||"null"); }catch(e){ return null; } }
function aplicarLectura(data){
  gasApplySeed_(data.seed);
  overridesState = data.overrides || {};
  notesState = data.notes || [];
  customTasksState = (data.customTasks || []).sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||""));
  meetingsState = data.meetings || [];
}

/* Vuelve a leer el Sheet después de guardar, para quedar igual que la hoja. */
async function gasRefresh_(){
  const data = await gasRead_();
  gasData = data;
  guardarLectura(data);
  if(resolveFirstRead) resolveFirstRead(data);
  aplicarLectura(data);
  if(dbMode!=="live") setSyncUI("live");
  render();
}

/* Content-Type por defecto (text/plain) a propósito: evita el preflight
   CORS, que los Web Apps de Apps Script no responden. */
/* Acciones que se pueden repetir sin duplicar nada: solo esas se reintentan. */
const ACCIONES_REPETIBLES = ["updateTask","setOverride","deleteTask","deleteNote","deleteMeetingSheet"];

/* Google a veces devuelve una página de error o un cuerpo vacío. Cuando el
   cuerpo llega vacío el backend ve un POST sin token y contesta "token
   inválido", aunque el token esté bien. Reintentar alcanza. */
/* Si el navegador sirvió una copia vieja de la página, se recarga una sola
   vez por versión nueva. Sin esto los arreglos publicados no llegan hasta que
   alguien hace un refresco forzado. */
async function chequearVersion_(){
  try{
    const r = await fetch(location.pathname + "?ts=" + Date.now(), {cache: "no-store"});
    const txt = await r.text();
    const m = txt.match(/window\.APP_VERSION = "([^"]+)"/);
    if(!m || m[1] === window.APP_VERSION) return;
    if(sessionStorage.getItem("gulli-version-recargada") === m[1]) return;
    sessionStorage.setItem("gulli-version-recargada", m[1]);
    location.reload();
  }catch(e){}
}

/* Los ids se calculan del contenido de la fila, así que cambian si alguien
   edita el texto de la tarea o la mueve. Cuando el backend dice que no la
   encuentra, se relee la hoja y se reintenta una sola vez con el id nuevo de
   esa misma tarea, en vez de hacerle repetir el cambio a mano. */
function esIdViejo_(e){ return /No encuentro esa tarea/i.test(String(e && e.message || "")); }

async function reintentarConIdNuevo_(action, payload){
  const anterior = TASKS.find(x=>x.id===payload.id);
  const clave = anterior ? claveTarea_(anterior) : null;
  try{ await gasRefresh_(); }catch(e){ return null; }
  if(!clave) return null;
  const ahora = TASKS.find(x=>x.source!=="etapa1" && claveTarea_(x)===clave);
  if(!ahora || ahora.id===payload.id) return null;
  return gasWrite_(action, Object.assign({}, payload, {id: ahora.id}));
}

/* Crear no se puede repetir a ciegas: duplicaría la fila. Cuando el alta se
   corta a mitad de camino (Google lento o sin respuesta) se relee la hoja y
   se mira si quedó cargada; recién si no está, se vuelve a mandar. */
async function reintentarAlta_(action, payload){
  try{ await gasRefresh_(); }catch(e){ return null; }
  if(action === "addTask"){
    const f = payload.fields || {};
    const ya = TASKS.some(t=> (t.source==="iniciativa" || t.source==="finalizado")
      && String(t.tema||"") === String(f.tema||"") && String(t.tarea||"") === String(f.tarea||""));
    return ya ? {yaEstaba:true} : gasWrite_(action, payload);
  }
  if(action === "addMeetingSheet"){
    const ya = (RAW.etapa1||[]).some(m=> m.fecha === payload.fecha
      && String(m.resultado||"") === String(payload.resumen||""));
    return ya ? {yaEstaba:true} : gasWrite_(action, payload);
  }
  return null;
}

async function gasWrite_(action, payload){
  const intentos = ACCIONES_REPETIBLES.includes(action) ? 3 : 1;
  let ultimo = null;
  for(let i=1; i<=intentos; i++){
    try{ return await gasWriteUna_(action, payload); }
    catch(e){
      ultimo = e;
      if(i===intentos || !e.reintentable) break;
      await new Promise(r=>setTimeout(r, 1200*i));
    }
  }
  throw ultimo;
}

async function gasWriteUna_(action, payload){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 45000);
  let res;
  try{
    res = await fetch(GAS_CFG.url, {
      method: "POST",
      body: JSON.stringify({token: GAS_CFG.token, action: action, payload: payload}),
      signal: ctrl.signal
    });
  }catch(e){
    // Sin respuesta: el cambio pudo guardarse igual; la relectura muestra lo que quedó.
    const err = new Error("sin respuesta de Google en "+action);
    err.soft = true;
    err.reintentable = true;
    throw err;
  }finally{
    clearTimeout(timer);
  }
  // A veces Google devuelve una página de error aunque el cambio se guardó.
  let json;
  try{ json = await res.json(); }
  catch(e){
    const err = new Error("respuesta no válida de Google en "+action);
    err.soft = true;
    err.reintentable = true;
    throw err;
  }
  if(!json.ok){
    const err = new Error(json.error || ("error en "+action));
    // Cuerpo vacío del lado de Google: el backend no vio el token. Se reintenta.
    if(/token inválido/i.test(err.message)) err.reintentable = true;
    throw err;
  }
  return json.result;
}

/* Reemplaza las tareas base por las que vienen del Sheet. */
function gasApplySeed_(seed){
  if(!seed) return;
  if(seed.tableros && seed.tableros.length) TABLEROS_DATA = seed.tableros;
  REUNIONES = seed.etapa1 || [];
  if(seed.opcionesReuniones) OPCIONES_REUNIONES = seed.opcionesReuniones;
  aplicarTablero_();
}

function gasOverridesDoc_(){
  return {
    async update(payload){
      const patch = (payload && payload.tasks) || {};
      for(const taskId of Object.keys(patch)){
        await gasWrite_("setOverride", {taskId: taskId, patch: patch[taskId] || {}});
      }
    },
    async set(payload){ return this.update(payload); },
    onSnapshot(cb){
      cb({exists:true, data: ()=> ({tasks: (gasData && gasData.overrides) || {}})});
    }
  };
}

const GAS_COLLECTIONS = {
  notes:       {key:"notes",       add:"addNote",        update:null,                del:"deleteNote"},
  customTasks: {key:"customTasks", add:"addCustomTask",  update:"updateCustomTask",  del:"deleteCustomTask"},
  meetings:    {key:"meetings",    add:"addMeeting",     update:null,                del:"deleteMeeting"}
};

function gasCollection_(name){
  const cfg = GAS_COLLECTIONS[name];
  const ref = {
    doc(id){
      return {
        async set(data){ await gasWrite_(cfg.add, Object.assign({}, data, {id: id})); },
        async update(patch){ if(cfg.update) await gasWrite_(cfg.update, {id: id, patch: patch}); },
        async delete(){ await gasWrite_(cfg.del, {id: id}); }
      };
    },
    orderBy(){ return ref; },
    limit(){ return ref; },
    onSnapshot(cb){
      cb({docs: ((gasData && gasData[cfg.key]) || []).map(row=>({data: ()=> row}))});
    }
  };
  return ref;
}

async function initGasStore_(){
  if(!gasConfigured()) return null;
  try{
    gasData = await gasRead_();
  }catch(e){ console.error("Apps Script no disponible:", e); return null; }
  gasApplySeed_(gasData.seed);
  return {
    doc(path){
      if(path==="board/overrides") return gasOverridesDoc_();
      throw new Error("doc path no soportado: "+path);
    },
    collection(name){
      if(!GAS_COLLECTIONS[name]) throw new Error("collection no soportada: "+name);
      return gasCollection_(name);
    }
  };
}

/* Con Sheet: muestra al instante la última lectura guardada y conecta en
   segundo plano. Si Google no responde, sigue reintentando y las ediciones se
   guardan igual: nunca pasa a "modo local" ni a datos viejos de la página. */
async function initSheetStore_(){
  const cache = leerLectura();
  if(cache && cache.seed){
    gasData = cache;
    aplicarLectura(cache);
    if(resolveFirstRead) resolveFirstRead(cache);
    render();
  }
  overridesDoc = gasOverridesDoc_();
  notesCol = gasCollection_("notes");
  customCol = gasCollection_("customTasks");
  meetingsCol = gasCollection_("meetings");
  chequearVersion_();
  // Cambios que quedaron sin enviar en una visita anterior.
  const previos = leerPendientes();
  if(previos.length){
    guardarPendientes([]);
    previos.forEach(p=>{ sheetWrite(p.action, p.payload); });
  }
  for(;;){
    try{
      const data = await gasRead_();
      gasData = data;
      guardarLectura(data);
      if(resolveFirstRead) resolveFirstRead(data);
      // Si hay cambios guardándose, la relectura al terminar actualiza la pantalla.
      if(sheetPending===0) aplicarLectura(data);
      setSyncUI("live");
      updateSyncLabel();
      render();
      return;
    }catch(e){
      console.error("Apps Script no disponible, se reintenta:", e);
      setSyncUI("retrying");
      updateSyncLabel();
      await new Promise(r=>setTimeout(r, 20000));
    }
  }
}

async function initStore(){
  if(gasConfigured()) return initSheetStore_();
  loadLocal();
  try{
    if(window.claude && typeof window.claude.use === "function"){
      dbNs = await window.claude.use("db");
    }
  }catch(e){ dbNs = null; }
  if(!dbNs){
    try{ dbNs = await initGasStore_(); }
    catch(e){ console.error("Error inicializando Apps Script:", e); dbNs = null; }
  }
  if(!dbNs){ setSyncUI("local"); render(); return; }
  overridesDoc = dbNs.doc("board/overrides");
  notesCol = dbNs.collection("notes");
  customCol = dbNs.collection("customTasks");
  meetingsCol = dbNs.collection("meetings");
  setSyncUI("live");
  overridesDoc.onSnapshot(snap=>{
    const data = snap.exists ? snap.data() : null;
    overridesState = (data && data.tasks) || {};
    render();
  }, err=>{ console.error(err); setSyncUI("local"); render(); });
  notesCol.orderBy("createdAt","desc").limit(200).onSnapshot(snap=>{
    notesState = snap.docs.map(d=>d.data());
    render();
  }, err=>{ console.error(err); });
  customCol.onSnapshot(snap=>{
    customTasksState = snap.docs.map(d=>d.data()).sort((a,b)=> (b.createdAt||"").localeCompare(a.createdAt||""));
    render();
  }, err=>{ console.error(err); });
  meetingsCol.orderBy("fecha","desc").limit(300).onSnapshot(snap=>{
    meetingsState = snap.docs.map(d=>d.data());
    render();
  }, err=>{ console.error(err); });
}

function currentEstado(t){
  if(t.source==="custom") return t.estado || "Por hacer";
  const ov = overridesState[t.id];
  if(ov && ov.estado) return ov.estado;
  return normEstado(t.estadoOriginal);
}
function taskLink(t){
  if(t.source==="custom") return t.link || null;
  const ov = overridesState[t.id];
  /* Los links viven en OBSERVACIONES de la hoja 02 (t.link). Los de la pestaña
     "WebApp - Overrides" quedan de antes y mandan mientras existan. */
  return (ov && ov.link) || t.link || null;
}

/* =====================================================================
   ESTADO DE FILTROS Y VISTA
   ===================================================================== */
const state = { view:"dashboard", filters:{tema:"", estado:"", responsable:"", prioridad:""} };
const VIEWS = [
  {id:"dashboard", label:"Dashboard"},
  {id:"plan", label:"Plan de trabajo"},
  {id:"finalizadas", label:"Finalizadas"},
  {id:"timeline", label:"Timeline"},
  {id:"reuniones", label:"Reuniones"},
  {id:"entregables", label:"Entregables"},
  {id:"notas", label:"Notas"},
];
const ESTADOS = ["Por hacer","En proceso","Seguimiento","En testeo","Completado"];
/* Nombre que se ve (y que se guarda en el Sheet) para cada estado interno. */
const ESTADO_LABEL = {"Por hacer":"Pendiente","En proceso":"En proceso","Seguimiento":"Seguimiento","En testeo":"En testeo","Completado":"Finalizada"};
function estadoLabel(e){ return ESTADO_LABEL[e] || e; }
function estadoClass(e){ return "st-" + String(e||"").replace(/\s+/g,"-").replace("ó","o"); }
const RESPONSABLES = ["Eve","Ger","Fer","Ari","Loopa","Supervisores","Equipo"];

function trackedTasks(){
  const seed = TASKS.filter(t=>t.source!=="etapa1")
    .filter(t=>{ const ov = overridesState[t.id]; return !(ov && ov.hidden); })
    .map(t=>{
      const ov = overridesState[t.id];
      // Un override vacío (null) no pisa las fechas que vienen del Sheet.
      if(!ov || (ov.inicio==null && ov.cierre==null)) return t;
      const merged = Object.assign({}, t);
      if(ov.inicio!=null) merged.inicio = ov.inicio;
      if(ov.cierre!=null) merged.cierre = ov.cierre;
      return merged;
    });
  return seed.concat(customTasksState.map(customAsTask));
}

function applyFilters(list){
  const f = state.filters;
  return list.filter(t=>{
    if(f.tema!=="" && temaDe(t)!==f.tema) return false;
    if(f.estado!=="" && currentEstado(t)!==f.estado) return false;
    if(f.responsable!==""){
      if(f.responsable==="__none__"){ if(t.responsable) return false; }
      else if(t.responsable!==f.responsable) return false;
    }
    if(f.prioridad!=="" && urgencia(t, currentEstado(t))!==f.prioridad) return false;
    return true;
  });
}

/* =====================================================================
   RENDER: SHELL / TABS
   ===================================================================== */
function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  VIEWS.forEach(v=>{
    const b = document.createElement("button");
    b.className = "tab-btn" + (state.view===v.id?" -active":"");
    b.textContent = v.label;
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", state.view===v.id ? "true":"false");
    b.onclick = ()=>{ state.view=v.id; render(); };
    nav.appendChild(b);
  });
}

/* Selector de tablero de trabajo: Administración · Médicos · Comercial. */
function renderTableroBar(){
  const bar = document.getElementById("tablero-bar");
  if(!bar) return;
  bar.innerHTML = "";
  TABLEROS_DATA.forEach(t=>{
    const pendientes = (t.iniciativas||[]).length;
    const b = document.createElement("button");
    b.className = "tablero-btn";
    b.setAttribute("aria-pressed", t.id===tableroActivo ? "true" : "false");
    b.innerHTML = `${escHtml(t.label)}<span class="n">${pendientes}</span>`;
    b.onclick = ()=> setTablero(t.id);
    bar.appendChild(b);
  });
}

function render(){
  renderTableroBar();
  renderTabs();
  const root = document.getElementById("view");
  root.innerHTML = "";
  const fns = {dashboard:renderDashboard, plan:renderPlan, finalizadas:renderFinalizadas, timeline:renderTimeline, reuniones:renderReuniones, entregables:renderEntregables, notas:renderNotas};
  (fns[state.view] || renderDashboard)(root);
}

/* =====================================================================
   RENDER: DASHBOARD
   ===================================================================== */
function renderDashboard(root){
  const tasks = trackedTasks();
  const withEstado = tasks.map(t=>({t, estado:currentEstado(t)}));
  const total = tasks.length;
  const completado = withEstado.filter(x=>x.estado==="Completado").length;
  const enProceso = withEstado.filter(x=>x.estado==="En proceso").length;
  const enRevision = withEstado.filter(x=>x.estado==="Seguimiento").length;
  const porHacer = withEstado.filter(x=>x.estado==="Por hacer").length;
  const bloqueado = withEstado.filter(x=>x.estado==="Bloqueado").length;
  const atrasadas = withEstado.filter(x=>isOverdue(x.t, x.estado)).length;
  const avance = total ? Math.round((completado/total)*100) : 0;

  let bannerClass = "", bannerTitle = "", bannerSub = "";
  if(bloqueado>0 || atrasadas > total*0.15){
    bannerClass="-risk"; bannerTitle="El proyecto necesita atención";
    bannerSub = bloqueado>0 ? bloqueado+" tarea(s) bloqueada(s) y "+atrasadas+" atrasada(s)." : atrasadas+" tareas atrasadas sobre "+total+" totales.";
  } else if(atrasadas>0){
    bannerClass="-warn"; bannerTitle="En curso, con algunos pendientes";
    bannerSub = atrasadas+" tarea(s) pasaron su fecha de cierre estimada.";
  } else {
    bannerClass=""; bannerTitle="En curso, buen ritmo";
    bannerSub = "Sin bloqueos ni atrasos registrados hoy.";
  }

  const upcoming = withEstado.filter(x=>x.estado!=="Completado" && dueDateOf(x.t))
    .sort((a,b)=> new Date(dueDateOf(a.t)) - new Date(dueDateOf(b.t))).slice(0,5);

  root.innerHTML = `
    <div class="view-head">
      <div>
        <h2 class="cond">Dashboard · Gulli ${"· "+tableroData().label}</h2>
        <p class="sub">Resumen del tablero de ${tableroData().label}. Cambiá de tablero con los botones de arriba.</p>
      </div>
    </div>

    <div class="status-banner ${bannerClass}"><span class="dot"></span>
      <div class="txt"><b>${bannerTitle}</b><span>${bannerSub}</span></div>
    </div>

    <div class="kpi-grid">
      <div class="kpi -accent"><span class="num mono-num">${avance}%</span><span class="lbl">Avance del proyecto</span></div>
      <div class="kpi"><span class="num mono-num">${total}</span><span class="lbl">Tareas totales</span></div>
      <div class="kpi"><span class="num mono-num">${completado}</span><span class="lbl">Finalizadas</span></div>
      <div class="kpi"><span class="num mono-num">${enProceso}</span><span class="lbl">Proceso</span></div>
      <div class="kpi"><span class="num mono-num">${porHacer}</span><span class="lbl">Pendientes</span></div>
      <div class="kpi ${atrasadas>0?'-warn':''}"><span class="num mono-num">${atrasadas}</span><span class="lbl">Vencidas</span></div>
    </div>

    <div class="fase-row" id="fase-row"></div>

    <div class="strategy-block">
      <div class="obj-head">
        <span class="micro">Objetivo · ${tableroData().label}</span>
        <p>${OBJETIVO}</p>
      </div>
      <div class="prio-list">
        ${PRIORIDADES.map(p=>{
          const a = avancePrioridad(Number(p.n), tasks);
          return `
          <div class="prio-item">
            <span class="n">Prioridad ${p.n}</span>
            <h4>${escHtml(p.tt||"")}</h4>
            <p>${escHtml(p.desc||"")}</p>
            <div class="prio-avance">
              <div class="fase-bar"><i style="width:${a.pct}%"></i></div>
              <div class="fase-nums"><span><b>${a.done}</b>/${a.total} listas</span><span><b>${a.pct}%</b></span></div>
            </div>
          </div>`;}).join("")}
      </div>
    </div>

    <div class="view-head" style="margin-bottom:14px">
      <h2 class="cond" style="font-size:24px">Próximos hitos</h2>
    </div>
    <div class="task-list" id="upcoming-list"></div>
  `;

  /* Tarjetas: avance por prioridad del trimestre. */
  const faseRow = root.querySelector("#fase-row");
  gruposDelTablero(withEstado.map(x=>x.t)).forEach(n=>{
    const items = withEstado.filter(x=>prioridadNum(x.t)===n);
    const done = items.filter(x=>x.estado==="Completado").length;
    const pct = items.length ? Math.round((done/items.length)*100) : 0;
    const card = document.createElement("div");
    card.className = "fase-card";
    card.innerHTML = `
      <span class="flabel">${escHtml(prioridadLabel(n))}</span>
      <span class="fsub">${n===SIN_PRIO ? "Falta asignarles prioridad" : "Prioridad "+n}</span>
      <div class="fase-bar"><i style="width:${pct}%"></i></div>
      <div class="fase-nums"><span><b>${done}</b>/${items.length} listas</span><span><b>${pct}%</b></span></div>
    `;
    faseRow.appendChild(card);
  });

  const upcomingRoot = root.querySelector("#upcoming-list");
  if(upcoming.length===0){
    upcomingRoot.innerHTML = `<div class="empty-note">No hay próximos vencimientos con fecha cargada.</div>`;
  } else {
    upcoming.forEach(x=> upcomingRoot.appendChild(taskRow(x.t)));
  }
}

function taskRow(t){
  const row = document.createElement("div");
  const estado = currentEstado(t);
  const overdue = isOverdue(t, estado);
  const link = taskLink(t);
  row.className = "task-row" + (overdue ? " -overdue" : "");
  const stClass = estadoClass(estado);
  row.innerHTML = `
    <div class="col-area">${t.source==="etapa1" ? '<span class="tk-tema">—</span>'
      : prioridadNum(t) ? `<span class="tk-prio">P${prioridadNum(t)}</span>`
      : '<span class="tk-prio -sin">Sin prioridad</span>'}</div>
    <div class="col-tema"><span class="tk-tema">${t.tema || "—"}${t.subfase?" · "+t.subfase:""}</span></div>
    <div class="col-tarea"><span class="tk-tarea">${t.tarea}${overdue?'<span class="tk-flags"><span class="flag">Vencida</span></span>':''}${t.source==="custom"&&!t.edited?'<span class="custom-tag">Nueva</span>':''}${link?' 🔗':''}</span></div>
    <div class="col-resp"><span class="tk-resp">${respLabel(t.responsable)}</span></div>
    <div class="col-dates">
      <span><b>Inicio</b> ${fmtDate(t.inicio)}</span><br>
      <span><b>Cierre</b> ${fmtDate(t.cierre || t.tiempo)}</span>
    </div>
    <div class="col-status">
      <select class="status-select ${stClass}" data-task="${t.id}">
        ${ESTADOS.map(e=>`<option value="${e}" ${e===estado?"selected":""}>${estadoLabel(e)}</option>`).join("")}
      </select>
    </div>
    <div class="col-observ"><span class="tk-obs">${t.obs || "—"}</span></div>
    <div class="col-obs row-actions">
      <button class="obs-btn" data-obs="${t.id}" aria-label="Editar tarea" title="Editar tarea">✎</button>
    </div>
  `;
  const sel = row.querySelector("select");
  // Recién creada y todavía guardándose en el Sheet: sin id definitivo no se puede editar.
  if(String(t.id).startsWith("tmp")){
    sel.disabled = true;
    row.querySelector(".obs-btn").disabled = true;
    row.querySelector(".tk-tarea").insertAdjacentHTML("beforeend", '<span class="custom-tag">Guardando…</span>');
    return row;
  }
  sel.addEventListener("change", ()=>{
    setEstado(t, sel.value);
  });
  row.querySelector(".obs-btn").addEventListener("click", ()=> openDetailModal(t));

  row.addEventListener("click", (e)=>{

    openDetailModal(t);
  });
  return row;
}

  Object.keys(byMonth).forEach(month=>{

/* Marca en rojo los campos obligatorios vacíos y dice cuáles faltan.
   Antes el botón no hacía nada y parecía roto. Devuelve true si falta alguno. */
function flagMissing(container, fields, anchor){
  container.querySelectorAll(".form-error").forEach(e=>e.remove());
  fields.forEach(([el])=>el.classList.toggle("-missing", !el.value.trim()));
  const missing = fields.filter(([el])=>!el.value.trim());
  if(!missing.length) return false;
  const msg = document.createElement("div");
  msg.className = "form-error";
  msg.setAttribute("role", "alert");
  msg.textContent = "Completá " + missing.map(([,label])=>label).join(" y ") + " para guardar.";
  anchor.insertAdjacentElement("afterend", msg);
  missing[0][0].focus();
  missing.forEach(([el])=>el.addEventListener("input", ()=>el.classList.remove("-missing"), {once:true}));
  return true;
}

      </div>
      <div class="field"><label class="flabel">Estado</label>

      </div>
    </div>

      <div class="field"><label class="flabel">Cierre</label><input type="date" id="ed-cierre" value="${t.cierre||t.tiempo||""}"></div>
    </div>

    <div class="field">
      <label class="flabel">Links del entregable (hasta 3: Drive, Docs, web…)</label>
      ${[0,1,2].map(i=>`<input type="url" id="ed-link${i+1}" placeholder="https://… (link ${i+1})" value="${esc(parseLinks(link)[i]||"")}" style="margin-bottom:6px">`).join("")}
      ${parseLinks(link).length?`<div style="margin-top:4px;display:flex;gap:14px;flex-wrap:wrap">${parseLinks(link).map((l,i)=>`<a class="entregable-link" href="${toHref(l)}" target="_blank" rel="noopener">Abrir link ${i+1} ↗</a>`).join("")}</div>`:""}
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="ed-save">Guardar cambios</button>
      <button class="btn-secondary" id="ed-cancel">Cancelar</button>
      <button class="btn-secondary" id="task-duplicate">Duplicar</button>
      <button class="btn-danger" id="task-delete">Eliminar tarea</button>
    </div>
  `;
  box.querySelector(".modal-close").onclick = closeModal;
  box.querySelector("#ed-cancel").onclick = closeModal;
  wireRespSelect(box.querySelector("#ed-resp"));
  /* Duplicar: abre "Nueva tarea" con los datos de esta, para editar la copia antes de guardarla. */
  box.querySelector("#task-duplicate").onclick = ()=>{
    openAddTaskModal({
      tarea: t.tarea + " (copia)", prioridad: t.prioridad, tema: t.tema, responsable: t.responsable,
      prioridad: t.prioridad, estado: estado, inicio: t.inicio, cierre: t.cierre || t.tiempo,
      obs: t.obs, links: parseLinks(link),
    });
  };
  box.querySelector("#ed-save").onclick = ()=>{
    if(flagMissing(box, [[box.querySelector("#ed-tarea"),"el nombre de la tarea"]], box.querySelector(".modal-actions"))) return;
    const val = id => box.querySelector(id).value.trim() || null;
    const orig = {prioridad:t.prioridad, tarea:t.tarea, tema:t.tema, responsable:t.responsable, inicio:t.inicio, cierre:t.cierre||t.tiempo, obs:t.obs};

    const fields = {};
    Object.keys(inputs).forEach(k=>{
      const before = orig[k]==null ? null : (String(orig[k]).trim() || null);
      const after = val(inputs[k]);
      if(after!==before) fields[k] = after;
    });
    const nuevosLinks = joinLinks([1,2,3].map(n=>box.querySelector("#ed-link"+n).value));
    if(nuevosLinks !== joinLinks(parseLinks(link))) fields.link = nuevosLinks;
    const nuevoEstado = box.querySelector("#ed-estado").value;
    if(nuevoEstado!==estado) fields.estado = nuevoEstado;
    if(Object.keys(fields).length) saveTaskEdits(t, fields);
    closeModal();
  };
  box.querySelector("#task-delete").onclick = ()=>{
    if(!confirm("¿Eliminar esta tarea?")) return;
    if(t.source==="custom") deleteCustomTask(t.id);
    else if(sheetMode()) sheetDeleteTask(t);
    else patchSeedOverride(t.id, {hidden:true});
    closeModal();
  };
  abrirModal();
}

    set("#nt-cierre", copia.cierre);
    set("#nt-obs", copia.obs);
    (copia.links||[]).forEach((l,i)=> set("#nt-link"+(i+1), l));
  }
  box.querySelector(".modal-close").onclick = closeModal;
  box.querySelector("#nt-cancel").onclick = closeModal;
  wireRespSelect(box.querySelector("#nt-resp"));
  box.querySelector("#nt-submit").onclick = ()=>{
    const tarea = box.querySelector("#nt-tarea").value.trim();
    if(flagMissing(box, [[box.querySelector("#nt-tarea"),"el nombre de la tarea"]], box.querySelector(".modal-actions"))) return;
    addCustomTask({
      tarea,
      prioridad: box.querySelector("#nt-prio").value || null,
      tema: box.querySelector("#nt-tema").value.trim() || null,
      responsable: box.querySelector("#nt-resp").value.trim() || null,
      obs: box.querySelector("#nt-obs").value.trim() || null,
      inicio: box.querySelector("#nt-inicio").value || null,
      cierre: box.querySelector("#nt-cierre").value || null,
      link: joinLinks([1,2,3].map(n=>box.querySelector("#nt-link"+n).value)),
      estado: box.querySelector("#nt-estado").value,
    });
    closeModal();
  };
  abrirModal();
}
function closeModal(){ document.getElementById("modal").hidden = true; }

/* La ventana ya no se cierra sola mientras se edita: un clic que empieza en un
   campo y termina afuera, o Escape para cerrar un desplegable o una fecha, no
   la cierran. Si se cierra desde afuera con cambios sin guardar, pregunta. */
let modalInicial = "";
let clicEmpezoEnFondo = false;
function modalSnapshot(){
  const box = document.getElementById("modal-box");
  return [...box.querySelectorAll("input, select, textarea")].map(el=>el.value).join("\u0001");
}
function abrirModal(){
  document.getElementById("modal").hidden = false;
  modalInicial = modalSnapshot();
}
function cerrarSiNoHayCambios(){
  if(document.getElementById("modal").hidden) return;
  if(modalSnapshot()!==modalInicial && !confirm("Tenés cambios sin guardar. ¿Cerrar igual?")) return;
  closeModal();
}
document.getElementById("modal").addEventListener("mousedown", (e)=>{ clicEmpezoEnFondo = e.target.id==="modal"; });
document.getElementById("modal").addEventListener("click", (e)=>{
  if(e.target.id==="modal" && clicEmpezoEnFondo) cerrarSiNoHayCambios();
  clicEmpezoEnFondo = false;
});
document.addEventListener("keydown", (e)=>{
  if(e.key!=="Escape") return;
  if(e.target && /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  cerrarSiNoHayCambios();
});

/* =====================================================================
   EXPORTAR A EXCEL (backup .xlsx con el estado actual)
   ===================================================================== */
function buildExportRows(){
  const planRows = trackedTasks().map(t=>{
    const estado = currentEstado(t);
    return {
      "Prioridad": t.prioridad || "",
      "Área": t.area || "",
      "Tema": t.tema || "",
      "Tarea": t.tarea,
      "Responsable": respLabel(t.responsable),
      "Inicio": t.inicio || "",
      "Cierre": t.cierre || t.tiempo || "",
      "Estado": estadoLabel(estado),
      "Prioridad": urgencia(t, estado),
      "Vencida": isOverdue(t, estado) ? "Sí" : "No",
      "Links": parseLinks(taskLink(t)).join(" | "),
      "Entregable / Obs.": t.obs || "",
    };
  });
  const etapa1Rows = RAW.etapa1.map(e=>({
    "Fecha": e.fecha, "Tarea": e.tarea, "Responsable": e.responsable, "Estado": e.estado, "Resultado": e.resultado || "",
  }));
  const reunionRows = (meetingsState.length ? meetingsState : [{}]).map(m=>({
    "Fecha": m.fecha || "", "Duración": m.duracion || "", "Responsable": m.responsable || "", "Resumen": m.resumen || "",
  }));
  const noteRows = (notesState.length ? notesState : [{}]).map(n=>({
    "Fecha": n.createdAt ? new Date(n.createdAt).toLocaleString("es-AR") : "", "Autor": n.author || "", "Nota": n.text || "",
  }));
  return {planRows, etapa1Rows, reunionRows, noteRows};
}

async function exportToExcel(btn){
  if(typeof XLSX === "undefined"){ alert("El generador de Excel todavía está cargando — probá de nuevo en unos segundos."); return; }
  const original = btn.textContent;
  btn.textContent = "Generando…"; btn.disabled = true;
  try{
    const {planRows, etapa1Rows, reunionRows, noteRows} = buildExportRows();
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(planRows), "Plan de trabajo");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(etapa1Rows), "Etapa 1 - Diagnostico");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(reunionRows), "Reuniones");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(noteRows), "Notas");
    const wbout = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const blob = new Blob([wbout], {type:"application/octet-stream"});
    const filename = "Gulli " + tableroData().label + " - Plan de trabajo (backup " + new Date().toISOString().slice(0,10) + ").xlsx";
    const downloads = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("downloads") : null;
    if(!downloads){ alert("La descarga no está disponible en esta vista."); return; }
    await downloads.save({filename, data:blob});
  }catch(e){
    if(!e || e.code!=="declined"){ console.error(e); alert("No se pudo generar el archivo. Probá de nuevo."); }
  }finally{
    btn.textContent = original; btn.disabled = false;
  }
}
document.getElementById("export-btn").addEventListener("click", (e)=> exportToExcel(e.currentTarget));

   INIT
   ===================================================================== */
render();
initStore();
</script>
